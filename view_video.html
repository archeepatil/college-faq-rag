<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EduQuery AI - Live Demo Video Player</title>
    <style>
        body {
            background-color: #0F172A;
            color: #F8FAFC;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #1E293B;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 980px;
            width: 100%;
            text-align: center;
        }
        h1 { margin-top: 0; font-size: 1.5rem; color: #60A5FA; }
        p { color: #94A3B8; font-size: 0.95rem; margin-bottom: 20px; }
        .video-box {
            border: 2px solid #334155;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        img { width: 100%; height: auto; display: block; }
        .badge-bar { margin-top: 15px; display: flex; gap: 10px; justify-content: center; }
        .badge { background: #3B82F6; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 EduQuery AI — Fast Live Presentation Walkthrough</h1>
        <p>Captures all 4 speaker actions: Q&A Ingestion, Zero-Hallucination Refusal, Policy Filtering, and Query Analytics.</p>
        <div class="video-box">
            <img src="fast_demo_video.webp" alt="Fast Live Demo Animation">
        </div>
        <div class="badge-bar">
            <span class="badge">4 Speaker Demo</span>
            <span class="badge">202 Frames</span>
            <span class="badge">Zero Hallucination</span>
            <span class="badge">Live Streamlit UI</span>
        </div>
    </div>
</body>
</html>
